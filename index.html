<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Streaming</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2226%22 font-size=%2228%22>🎬</text></svg>">
  <style>
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      margin: 0; 
      padding: 0; 
    }
    body { 
      background-color: #141414; 
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; /* Alineado arriba para que ambas pestañas coincidan */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px 40px 16px; /* Distancia superior fija perfecta */
      overflow-x: hidden;
    }
    .card { 
      background-color: #1a1a1a; 
      width: 100%; 
      max-width: 440px; 
      border-radius: 16px; 
      padding: 24px 20px; 
      box-shadow: 0 12px 36px rgba(0,0,0,0.8); 
      text-align: center; 
      border: 1px solid #282828; 
      margin: 0 auto;
    }
    
    /* Pestañas superiores */
    .nav-tabs {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid #2d2d2d;
      padding-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #888;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #2a2a2a;
      color: #ffffff;
      border-color: #3d3d3d;
    }

    .brand-title {
      color: #E50914;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    h2 { 
      color: #ffffff; 
      margin-bottom: 14px; 
      font-size: 18px; 
      font-weight: 700;
    }

    /* Vistas */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Formulario de Inicio */
    .sub-form { 
      font-size: 13px; 
      color: #aaa; 
      margin-bottom: 18px; 
      line-height: 1.4; 
    }

    /* Input con borde blanco permanente y visible */
    input[type="tel"] { 
      width: 100%; 
      padding: 15px; 
      border-radius: 10px; 
      border: 1.5px solid #ffffff !important; /* Blanco visible en PC y móvil */
      background: #202020; 
      color: #ffffff; 
      font-size: 17px; 
      margin-bottom: 14px; 
      outline: none; 
      text-align: center; 
      letter-spacing: 1px; 
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }
    input[type="tel"]:focus { 
      border-color: #ffffff !important; 
      background: #262626; 
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
    }
    input[type="tel"]::placeholder {
      color: #777777;
    }

    .btn-action { 
      width: 100%; 
      padding: 15px; 
      border: none; 
      border-radius: 8px; 
      background-color: #E50914; 
      color: white; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: background 0.2s, transform 0.1s; 
    }
    .btn-action:hover { background-color: #f40612; }
    .btn-action:active { transform: scale(0.98); }
    .btn-action:disabled { background-color: #555555; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      border: 1px solid #383838;
      border-radius: 8px;
      background-color: #242424;
      color: #ccc;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-secondary:hover { background-color: #2c2c2c; }

    /* Selector de dispositivo */
    .device-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .dev-card {
      background: #202020;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 22px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      color: #cccccc;
    }
    .dev-card:hover { 
      border-color: #E50914; 
      background: #262626;
      color: #ffffff;
      transform: translateY(-2px);
    }
    .icon-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
      stroke: #E50914;
      transition: stroke 0.2s ease, transform 0.2s ease;
    }
    .dev-card:hover .icon-wrap svg {
      stroke: #ff2b36;
      transform: scale(1.08);
    }
    .dev-card .name { 
      font-size: 14px; 
      font-weight: 700; 
      letter-spacing: 0.3px;
    }

    /* Pasos guiados */
    .step-indicator {
      font-size: 11px;
      font-weight: 800;
      color: #E50914;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .step-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .step-desc {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 14px;
      line-height: 1.4;
    }
